services:
  # ① 常時録画サービス (FFmpegレコーダー)
  tapo-recorder:
    build: .
    container_name: tapo-recorder
    restart: always
    network_mode: host
    environment:
      - TAPO_USER=${TAPO_USER}
      - TAPO_PASS=${TAPO_PASS}
      - TAPO_IP=${TAPO_IP}
      - TAPO_PORT=${TAPO_PORT}
      - TAPO_STREAM=${TAPO_STREAM}
      - PYTHONUNBUFFERED=1
    volumes:
      - ./data:/app/data
    command: python record_tapo.py

  # ② 在室判定サービス (YOLO + 複合判定ログ出力 + VPS送信)
  occupancy-detector:
    build: .
    container_name: occupancy-detector
    restart: always
    network_mode: host
    environment:
      - TAPO_USER=${TAPO_USER}
      - TAPO_PASS=${TAPO_PASS}
      - TAPO_IP=${TAPO_IP}
      - TAPO_PORT=${TAPO_PORT}
      - TAPO_STREAM=${TAPO_STREAM}
      - STAFF_MACS=${STAFF_MACS}
      - VPS_API_URL=${VPS_API_URL}
      - PYTHONUNBUFFERED=1
    volumes:
      - ./data:/app/data
    command: python occupancy_detector.py
